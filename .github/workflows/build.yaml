name: Build libmpv-android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          # libaribcaption requires cmake_minimum_required(3.28),
          # the runner ships 3.22.
          cmake-version: '3.31.6'
      - name: Setup Python (libplacebo)
        run: |
          # libplacebo pre-processes its GLSL shaders with a jinja2 template,
          # so both packages are needed to build it.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-jinja2
          python3 -c 'import jinja2, markupsafe'
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_default.sh
          ./bundle_default.sh
      - name: Bundle (full)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_full.sh
          ./bundle_full.sh
      - name: Bundle (encoders-gpl)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_encoders-gpl.sh
          ./bundle_encoders-gpl.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./buildscripts/*.jar
            ./buildscripts/artifacts/**
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            buildscripts/*.zip
            buildscripts/artifacts/**
